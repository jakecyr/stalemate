name: Release
on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      date: ${{ steps.meta.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: meta
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,isDraft,isPrerelease > releases.json
          python3 scripts/release.py --releases releases.json --notes release-notes.md --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.release == 'true'
        with:
          name: release-notes
          path: release-notes.md
  binaries:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
          - {os: windows, arch: amd64}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          DATE: ${{ needs.plan.outputs.date }}
        run: python3 scripts/package.py --os "$TARGET_OS" --arch "$TARGET_ARCH" --version "$VERSION" --commit "$COMMIT" --date "$DATE"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
  image:
    needs: [plan, binaries]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.plan.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=${{ needs.plan.outputs.version }}
            COMMIT=${{ needs.plan.outputs.commit }}
            BUILD_DATE=${{ needs.plan.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Public release archives also support offline deployments and registries
      # whose organization policy requires a one-time visibility change.
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p images
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "ghcr.io/$GITHUB_REPOSITORY:$VERSION"
            docker save "ghcr.io/$GITHUB_REPOSITORY:$VERSION" | gzip > "images/stalemate_docker_linux_$arch.tar.gz"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images/*
  publish:
    needs: [plan, binaries, image]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: actions/download-artifact@v4
        with:
          name: images
          path: dist
      - working-directory: dist
        run: sha256sum *.tar.gz *.zip > checksums.txt
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            git fetch origin tag "$VERSION"
            if [ "$(git rev-parse "$VERSION^{commit}")" != "$COMMIT" ]; then
              echo "Existing version tag points to another commit; refusing to replace its assets."
              exit 1
            fi
          fi
          if gh release view "$VERSION" --json isDraft > release-state.json 2>/dev/null; then
            if python3 -c 'import json,sys; sys.exit(0 if json.load(open("release-state.json"))["isDraft"] else 1)'; then
              gh release upload "$VERSION" dist/* --clobber
            else
              echo "Release already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$VERSION" --target "$COMMIT" --title "$VERSION" --notes-file release-notes.md --draft dist/*
          fi
          gh release edit "$VERSION" --target "$COMMIT" --draft=false --latest --notes-file release-notes.md
