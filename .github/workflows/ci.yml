name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stalemate_test
          POSTGRES_USER: stalemate
          POSTGRES_PASSWORD: fixture-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stalemate -d stalemate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STALEMATE_TEST_POSTGRES: postgres://stalemate:fixture-password@localhost:5432/stalemate_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: make build
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: sh -n install.sh docker/entrypoint.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: stalemate:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: python3 scripts/docker_smoke.py
